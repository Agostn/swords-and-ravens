name: Teste do site completo

# Faz no GitHub exatamente o que o Codespace faz (instalar.sh + iniciar.sh) e depois
# joga partidas inteiras pelo site com 3 contas, no computador e no celular.
# Se algo quebrar, o "x" vermelho aparece no GitHub e os prints ficam em "Artifacts".

on:
  push:
    branches: [design-novo]
  workflow_dispatch:

permissions:
  contents: write # para guardar os logs de uma falha na branch ci-resultados

jobs:
  site:
    name: Site + partidas do robô
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalação (igual ao Codespace)
        run: bash .devcontainer/instalar.sh

      - name: Testes automáticos do jogo (jest) e do site (dotnet test)
        run: |
          (cd agot-bg-game-server && npx jest)
          (cd agot-bg-website-dotnet && dotnet test agot-bg-website-dotnet.slnx)

      - name: Ligar o site (igual ao Codespace)
        run: |
          nohup bash .devcontainer/iniciar.sh > /tmp/iniciar.log 2>&1 &
          for i in $(seq 1 180); do
            grep -q "PRONTO" /tmp/iniciar.log && break
            grep -q "ERRO" /tmp/iniciar.log && break
            sleep 5
          done
          cat /tmp/iniciar.log
          grep -q "PRONTO" /tmp/iniciar.log

      - name: Formulário recusado mostra uma página (e não um arquivo vazio)
        run: |
          code=$(curl -s -o /tmp/recusado.html -w "%{http_code}" -X POST -d "Input.UserName=x" http://localhost:8000/Identity/Account/Login)
          echo "status $code"; head -c 400 /tmp/recusado.html; echo
          [ "$code" = "400" ] && grep -q "Não deu para enviar" /tmp/recusado.html

      - name: Abrir o Codespace de novo não derruba o site
        run: |
          bash .devcontainer/iniciar.sh > /tmp/iniciar2.log 2>&1
          cat /tmp/iniciar2.log
          grep -q "O site já está ligado" /tmp/iniciar2.log
          grep -q "PRONTO" /tmp/iniciar2.log

      - name: Navegador para os robôs
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null
          npm install playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium

      - name: Partida inteira no computador
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
        run: |
          node tools/qa/site/partida-completa.js prints/computador 1500 | tee /tmp/computador.log
          grep -q "FIM DE JOGO" /tmp/computador.log

      - name: Partida inteira no celular
        env:
          PLAYWRIGHT_MODULE: /tmp/pw/node_modules/playwright
          DEVICE: iPhone 13
        run: |
          node tools/qa/site/partida-completa.js prints/celular 1500 | tee /tmp/celular.log
          grep -q "FIM DE JOGO" /tmp/celular.log

      - name: Logs
        if: always()
        run: |
          mkdir -p prints
          cp /tmp/iniciar.log /tmp/site.log /tmp/servidor-do-jogo.log /tmp/gerar-jogo.log /tmp/*.log prints/ 2>/dev/null || true

      # Se falhar, guarda os textos dos logs (sem as imagens) numa branch separada,
      # "ci-resultados", para dar para ler sem baixar o arquivo do Actions.
      - name: Guardar logs da falha na branch ci-resultados
        if: failure()
        run: |
          mkdir -p /tmp/ci && cd /tmp/ci
          git init -q && git checkout -q -b ci-resultados
          mkdir -p "run-${{ github.run_id }}"
          cp /tmp/*.log "run-${{ github.run_id }}/" 2>/dev/null || true
          ls "$GITHUB_WORKSPACE"/prints/computador/*.png 2>/dev/null | tail -2 | xargs -r -I{} cp {} "run-${{ github.run_id }}/"
          ls "$GITHUB_WORKSPACE"/prints/celular/*.png 2>/dev/null | tail -2 | xargs -r -I{} sh -c 'cp "$1" "run-${{ github.run_id }}/celular-$(basename "$1")"' _ {}
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "logs da execução ${{ github.run_id }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-resultados

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-e-logs
          path: prints
          retention-days: 14
