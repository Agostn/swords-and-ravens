<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <base href="/"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#17130f">
    <title>Jogar - O GoT dos Games</title>
</head>
<body>
    <div id="root"></div>
    <!--
    In production, the website backend replaces the AUTH_DATA_JSON text below with the actual
    JSON auth payload (userId, requestUserId, gameId, authToken) the client needs to authenticate
    its own WebSocket connection to the game server. This has to be a real element with literal
    placeholder *text* (not an HTML comment) because html-webpack-plugin's production minifier
    strips HTML comments entirely, which would silently delete an HTML-comment-based placeholder
    from the built bundle before any backend ever gets to replace it. type="application/json"
    keeps html-minifier-terser from touching/minifying it as JS, and browsers never execute or
    parse a non-JS <script> tag, so this is inert until the backend substitutes real JSON into it.
    -->
    <script id="auth-data" type="application/json">AUTH_DATA_JSON</script>
</body>
</html>
